<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-label="Training run: train and validation loss falling over 40 epochs" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .mono { font: 500 12px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; fill: #6B7590; }
      .title { font: 600 15px/1 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #E8ECF4; }
      .axis { stroke: #242B3A; stroke-width: 1; }
      .train, .val { fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round;
        stroke-dasharray: 700; stroke-dashoffset: 700; animation: draw 7s cubic-bezier(.3,.6,.4,1) infinite; }
      .train { stroke: #8B9CFF; } .val { stroke: #F5B14C; animation-delay: .3s; }
      @keyframes draw { 0% { stroke-dashoffset: 700 } 70%, 90% { stroke-dashoffset: 0 } 100% { stroke-dashoffset: 0; opacity: 0 } }
      .ep { animation: ep 7s linear infinite; }
      @keyframes ep { 0%,10% { opacity: 0 } 11% { opacity: 1 } 100% { opacity: 1 } }
      @media (prefers-reduced-motion: reduce) { .train, .val { animation: none; stroke-dashoffset: 0 } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="899" height="199" rx="18" fill="#12161F" stroke="#242B3A"/>
  <text class="title" x="44" y="40">Training run</text>
  <g transform="translate(700 26)">
    <rect width="12" height="3" y="6" rx="1.5" fill="#8B9CFF"/><text class="mono" x="18" y="12">train loss</text>
    <rect width="12" height="3" x="90" y="6" rx="1.5" fill="#F5B14C"/><text class="mono" x="108" y="12">val loss</text>
  </g>

  <g transform="translate(60 60)">
    <line class="axis" x1="0" y1="0" x2="0" y2="100"/>
    <line class="axis" x1="0" y1="100" x2="780" y2="100"/>
    <text class="mono" x="-8" y="6" text-anchor="end">2.4</text>
    <text class="mono" x="-8" y="104" text-anchor="end">0.2</text>
    <text class="mono" x="0" y="120">0</text>
    <text class="mono" x="780" y="120" text-anchor="end">40 epochs</text>

    <path class="train" d="M0 2 C 60 8, 90 40, 160 58 S 300 80, 400 86 S 620 92, 780 94"/>
    <path class="val"   d="M0 4 C 60 12, 100 44, 170 62 S 310 82, 420 85 S 640 88, 780 88"/>

    <circle cx="780" cy="94" r="4" fill="#8B9CFF">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.68;0.72;0.9;1" dur="7s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g class="ep" transform="translate(190 40)">
    <text class="mono" x="0" y="0">
      <tspan>epoch </tspan>
      <tspan fill="#E8ECF4">40</tspan>
      <tspan dx="12">·</tspan>
      <tspan dx="12">loss </tspan>
      <tspan fill="#E8ECF4">0.21</tspan>
      <tspan dx="12">·</tspan>
      <tspan dx="12">lr 3e-4</tspan>
    </text>
  </g>
</svg>
