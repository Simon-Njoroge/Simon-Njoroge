<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" role="img" aria-label="Simon Njoroge, machine learning and AI engineer. A model reads a prompt, thinks, and answers." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#5A6480"/>
      <stop offset="0.45" stop-color="#5A6480"/>
      <stop offset="0.5" stop-color="#E8ECF4"/>
      <stop offset="0.55" stop-color="#5A6480"/>
      <stop offset="1" stop-color="#5A6480"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="1.6s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="promptClip"><rect x="0" y="0" height="30" width="0">
      <animate attributeName="width" values="0;0;380;380;380;380;0" keyTimes="0;0.02;0.2;0.92;0.96;0.98;1" dur="13s" calcMode="linear" repeatCount="indefinite"/>
    </rect></clipPath>
    <clipPath id="answerClip"><rect x="0" y="0" height="60" width="0">
      <animate attributeName="width" values="0;0;0;420;420;0" keyTimes="0;0.5;0.52;0.78;0.96;1" dur="13s" calcMode="linear" repeatCount="indefinite"/>
    </rect></clipPath>
    <style>
      .name { font: 600 40px/1 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #F2F4F8; letter-spacing: -0.5px; }
      .role { font: 400 17px/1 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #A7B0C4; }
      .mono { font: 500 14px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .prompt { fill: #E8ECF4; }
      .answer { fill: #C9D1E3; }
      .muted { fill: #6B7590; }
      .think { fill: url(#shimmer); font-weight: 600; }
      .cursor { fill: #8B9CFF; animation: blink 1s steps(2, start) infinite; }
      @keyframes blink { to { visibility: hidden; } }

      /* thinking phase: 20% -> 50% of a 13s loop */
      .thinkPhase { opacity: 0; animation: thinkPhase 13s linear infinite; }
      @keyframes thinkPhase { 0%,19% { opacity: 0 } 22%,48% { opacity: 1 } 51%,100% { opacity: 0 } }

      .edge { stroke: #2A3247; stroke-width: 1.4; fill: none; }
      .flow { stroke: #8B9CFF; stroke-width: 1.6; fill: none; stroke-dasharray: 5 14; stroke-linecap: round;
              animation: flow 1.1s linear infinite; }
      .flow.b { stroke: #F5B14C; animation-duration: 1.5s; }
      @keyframes flow { to { stroke-dashoffset: -19; } }
      .node { fill: #1C2233; stroke: #3A4560; stroke-width: 1.4; }
      .node.hot { animation: pulse 1.6s ease-in-out infinite; }
      .node.hot.d1 { animation-delay: .25s } .node.hot.d2 { animation-delay: .5s } .node.hot.d3 { animation-delay: .75s }
      @keyframes pulse { 0%,100% { fill: #1C2233; stroke: #3A4560 } 50% { fill: #8B9CFF; stroke: #C9D1FF } }
      .dot { fill: #8B9CFF; animation: dots 1.2s ease-in-out infinite; }
      .dot.d1 { animation-delay: .2s } .dot.d2 { animation-delay: .4s }
      @keyframes dots { 0%,100% { opacity: .25; transform: translateY(0) } 50% { opacity: 1; transform: translateY(-3px) } }

      .grid { stroke: #1B2130; stroke-width: 1; }
      @media (prefers-reduced-motion: reduce) {
        * { animation: none !important; }
        .thinkPhase { opacity: 1; }
      }
    </style>
  </defs>

  <!-- card -->
  <rect x="0.5" y="0.5" width="899" height="269" rx="18" fill="#12161F" stroke="#242B3A"/>

  <!-- left: identity -->
  <text class="name" x="44" y="112">Simon Njoroge</text>
  <text class="role" x="44" y="145">Machine learning &amp; AI engineer</text>
  <text class="role" x="44" y="170" fill="#6B7590">Nairobi, Kenya</text>
  <g transform="translate(44 200)">
    <rect width="120" height="26" rx="13" fill="#1A2030" stroke="#2A3247"/>
    <circle cx="16" cy="13" r="4" fill="#4ADE80"><animate attributeName="opacity" values="1;.35;1" dur="2.2s" repeatCount="indefinite"/></circle>
    <text class="mono" x="28" y="17.5" fill="#A7B0C4" font-size="12">open to work</text>
  </g>

  <!-- right: model panel -->
  <g transform="translate(430 28)">
    <rect width="440" height="214" rx="12" fill="#0C0F16" stroke="#242B3A"/>
    <line class="grid" x1="0" y1="34" x2="440" y2="34"/>
    <circle cx="18" cy="17" r="4.5" fill="#FF5F57"/><circle cx="32" cy="17" r="4.5" fill="#FEBC2E"/><circle cx="46" cy="17" r="4.5" fill="#28C840"/>
    <text class="mono muted" x="60" y="21.5" font-size="12">model.chat()</text>

    <!-- prompt line -->
    <g transform="translate(20 62)">
      <text class="mono muted" x="0" y="0">›</text>
      <g clip-path="url(#promptClip)" transform="translate(16 -14)">
        <text class="mono prompt" x="0" y="14">how does a transformer decide what matters?</text>
      </g>
    </g>

    <!-- thinking phase -->
    <g class="thinkPhase">
      <g transform="translate(36 96)">
        <text class="mono think" x="0" y="0">Thinking</text>
        <g transform="translate(74 -3)">
          <circle class="dot" cx="0" cy="0" r="2.2"/>
          <circle class="dot d1" cx="8" cy="0" r="2.2"/>
          <circle class="dot d2" cx="16" cy="0" r="2.2"/>
        </g>
      </g>
      <!-- tiny network -->
      <g transform="translate(305 80) scale(0.8)">
        <path class="edge" d="M10 10 L70 30 M10 10 L70 70 M10 50 L70 30 M10 50 L70 70 M10 90 L70 30 M10 90 L70 70 M70 30 L130 50 M70 70 L130 50"/>
        <path class="flow" d="M10 10 L70 30 M10 50 L70 70 M10 90 L70 30 M70 30 L130 50"/>
        <path class="flow b" d="M10 10 L70 70 M10 50 L70 30 M10 90 L70 70 M70 70 L130 50"/>
        <circle class="node hot" cx="10" cy="10" r="6"/>
        <circle class="node hot d1" cx="10" cy="50" r="6"/>
        <circle class="node hot d2" cx="10" cy="90" r="6"/>
        <circle class="node hot d1" cx="70" cy="30" r="7"/>
        <circle class="node hot d3" cx="70" cy="70" r="7"/>
        <circle class="node hot d2" cx="130" cy="50" r="8"/>
      </g>
      <text class="mono muted" x="36" y="122" font-size="11">weighing 4,096 tokens · 32 heads</text>
    </g>

    <!-- answer -->
    <g transform="translate(20 152)">
      <g clip-path="url(#answerClip)" transform="translate(0 -14)">
        <text class="mono answer" x="0" y="14">Attention scores every token against every other,</text>
        <text class="mono answer" x="0" y="36">then keeps what the next word depends on.</text>
      </g>
    </g>
    <rect class="cursor" x="20" y="186" width="7" height="14" rx="1"/>
  </g>
</svg>
