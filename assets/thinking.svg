<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Simon Njoroge, machine learning and AI engineer. An animated model core thinks: tokenizing, attending, reasoning, sampling." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.35" stop-color="#B9C4FF"/>
      <stop offset="0.7" stop-color="#8B9CFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B9CFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B9CFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="shimmer" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#6B7590"/>
      <stop offset="0.45" stop-color="#6B7590"/>
      <stop offset="0.5" stop-color="#F2F4F8"/>
      <stop offset="0.55" stop-color="#6B7590"/>
      <stop offset="1" stop-color="#6B7590"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <style>
      .name { font: 600 42px/1 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #F2F4F8; letter-spacing: -0.5px; }
      .role { font: 400 17px/1 -apple-system, "Segoe UI", Inter, Roboto, Helvetica, Arial, sans-serif; fill: #A7B0C4; }
      .mono { font: 500 13px/1 ui-monospace, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
      .think { fill: url(#shimmer); font-weight: 600; letter-spacing: 1px; }
      .phase { fill: #8B9CFF; opacity: 0; animation: phase 8s linear infinite; }
      .p1 { animation-delay: 0s } .p2 { animation-delay: 2s } .p3 { animation-delay: 4s } .p4 { animation-delay: 6s }
      @keyframes phase { 0% { opacity: 0; transform: translateY(6px) } 6%, 20% { opacity: 1; transform: translateY(0) } 25%, 100% { opacity: 0; transform: translateY(-6px) } }
      .orbit { fill: none; stroke: #2A3247; stroke-width: 1.2; }
      .sat { fill: #8B9CFF; }
      .sat.b { fill: #F5B14C; }
      .spark { fill: #C9D1E3; opacity: 0; animation: spark 2.4s ease-out infinite; }
      .s2 { animation-delay: .6s } .s3 { animation-delay: 1.2s } .s4 { animation-delay: 1.8s }
      @keyframes spark { 0% { opacity: 0; transform: scale(0.2) } 15% { opacity: .9 } 100% { opacity: 0; transform: scale(1) } }
      .bar { fill: #1A2030; } .fill { fill: #8B9CFF; }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } .phase.p1 { opacity: 1 } }
    </style>
  </defs>

  <rect x="0.5" y="0.5" width="899" height="299" rx="18" fill="#12161F" stroke="#242B3A"/>

  <!-- identity -->
  <text class="name" x="44" y="128">Simon Njoroge</text>
  <text class="role" x="44" y="160">Machine learning &amp; AI engineer</text>
  <text class="role" x="44" y="185" fill="#6B7590">Nairobi, Kenya</text>

  <!-- the model core -->
  <g transform="translate(700 150)">
    <circle r="110" fill="url(#glow)">
      <animate attributeName="r" values="100;118;100" dur="4s" repeatCount="indefinite"/>
    </circle>

    <!-- three tilted orbits, each rotating at its own speed -->
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      <ellipse class="orbit" rx="96" ry="34" transform="rotate(-20)"/>
      <g transform="rotate(-20)"><circle class="sat" cx="96" cy="0" r="4"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="9s" repeatCount="indefinite"/>
      <ellipse class="orbit" rx="80" ry="30" transform="rotate(50)"/>
      <g transform="rotate(50)"><circle class="sat b" cx="-80" cy="0" r="3.5"/></g>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="21s" repeatCount="indefinite"/>
      <ellipse class="orbit" rx="104" ry="40" transform="rotate(110)"/>
      <g transform="rotate(110)"><circle class="sat" cx="0" cy="40" r="3"/></g>
    </g>

    <!-- sparks leaving the core -->
    <g style="transform-origin:0 0">
      <circle class="spark"    cx="34"  cy="-26" r="2.5" style="transform-origin:0 0"/>
      <circle class="spark s2" cx="-40" cy="18"  r="2"   style="transform-origin:0 0"/>
      <circle class="spark s3" cx="12"  cy="42"  r="2.5" style="transform-origin:0 0"/>
      <circle class="spark s4" cx="-22" cy="-38" r="2"   style="transform-origin:0 0"/>
    </g>

    <!-- breathing core -->
    <circle r="26" fill="url(#core)">
      <animate attributeName="r" values="22;30;22" dur="2.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </circle>
    <circle r="7" fill="#FFFFFF">
      <animate attributeName="opacity" values="1;.6;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- status line under the identity -->
  <g transform="translate(44 232)">
    <text class="mono think" x="0" y="0">THINKING</text>
    <g transform="translate(96 0)">
      <text class="mono phase p1" x="0" y="0">tokenizing the prompt</text>
      <text class="mono phase p2" x="0" y="0">attending across 4,096 tokens</text>
      <text class="mono phase p3" x="0" y="0">reasoning over the context</text>
      <text class="mono phase p4" x="0" y="0">sampling the next token</text>
    </g>
    <rect class="bar" x="0" y="14" width="300" height="3" rx="1.5"/>
    <rect class="fill" x="0" y="14" width="0" height="3" rx="1.5">
      <animate attributeName="width" values="0;300;300;0" keyTimes="0;0.9;0.96;1" dur="8s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
